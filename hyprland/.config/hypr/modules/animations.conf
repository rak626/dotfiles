# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Performance-optimized bezier curves
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = fluent_out, 0.1, 1, 0, 1

    # Window animations: Quick and snappy
    animation = windows, 1, 3, easeOutQuint, popin 80%
    animation = windowsIn, 1, 3, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3, easeOutQuint, popin 80%
    
    # Fade animations: Short duration to feel responsive
    animation = fade, 1, 3, default
    
    # Workspace animations: Slide for clear spatial orientation
    animation = workspaces, 1, 3, fluent_out, slide
    
    # Border & BorderAngle: Kept minimal to save GPU cycles
    animation = border, 1, 3, default
    animation = borderangle, 0, 10, default # Disabled by default for performance
}
