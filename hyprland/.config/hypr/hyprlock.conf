general {
    ignore_empty_input = true
    no_fade_in = false
}

background {
    monitor =
    path = ~/dotfiles/backgrounds/wallpaper-1.jpg
    color = rgb(40, 44, 52)
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center

    inner_color = rgb(33, 37, 43)
    outer_color = rgb(198, 120, 221)
    outline_thickness = 2

    font_color = rgb(171, 178, 191)
    placeholder_text = <i>Password...</i>
    check_color = rgb(152, 195, 121)
    fail_color = rgb(224, 108, 117)
    fail_text = <i>$FAIL</i>

    rounding = 10
    shadow_passes = 2
    fade_on_empty = false
}
