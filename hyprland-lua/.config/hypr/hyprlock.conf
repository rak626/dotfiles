general {
    ignore_empty_input = true
    no_fade_in = false
}

background {
    monitor =
    color = rgb(35, 33, 54)
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center

    inner_color = rgb(42, 39, 63)
    outer_color = rgb(196, 167, 231)
    outline_thickness = 2

    font_color = rgb(224, 222, 244)
    placeholder_text = <i>Password...</i>
    check_color = rgb(62, 143, 176)
    fail_color = rgb(235, 111, 146)
    fail_text = <i>$FAIL</i>

    rounding = 10
    shadow_passes = 2
    fade_on_empty = false
}
