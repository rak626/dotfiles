format = """\
$username\
$directory\
$git_branch\
$git_status \
$cmd_duration\
$character"""

palette = "one_dark"
# palette = "everforest"

[username]
show_always = false
style_user = "bold white"
format = "[$user]($style) "

[directory]
style = "bold cyan"
truncation_length = 2
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "bold purple"
format = "[\\[$branch\\]]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "
conflicted = "= "
ahead = "↑ "
behind = "↓ "
diverged = "↕ "
untracked = "? "
stashed = "$ "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](yellow)"

[package]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[python]
disabled = true

